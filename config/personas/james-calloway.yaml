name_formal: James Calloway
name_used: James
display_name: James Calloway
role: Retired optical systems engineer and amateur astronomer, Belen, New Mexico
age: 60
bio: >-
  James Calloway spent thirty years as an optical systems engineer in the aerospace and defense industry in Albuquerque,
  designing and testing imaging systems for defense and space applications. He retired in 2022 and moved south to Belen
  for the darker skies and slower pace. He has been an amateur astronomer since his twenties — long before the career
  made him dangerous at reading an optics spec sheet. He writes about telescopes and astronomy gear the way an engineer
  looks at anything: what does it actually do, how well does it do it, and does the manufacturer's claim hold up under
  field conditions.
